<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>空間偏好 AR：多人連機與標記定位版</title>
<!-- 引入 TensorFlow.js 與 COCO-SSD 用於即時偵測人物與手持手機 -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<!-- 引入 PeerJS 支援 GitHub Pages 無後端 WebRTC 多人連機與即時地圖同步 -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { --fg:#fff; --dim:rgba(255,255,255,.62); --line:rgba(255,255,255,.28); --bg:rgba(0,0,0,.55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select:none; user-select:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cam { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; pointer-events:none; }

  #bar[hidden] { display:none; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index:5; }
  .btn { appearance:none; border:1px solid var(--line); background:var(--bg); color:var(--fg);
    font:500 14px/1 inherit; padding:12px 14px; border-radius:999px; min-height:44px; min-width:44px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor:pointer; }
  .btn:active, .btn.on { background:#fff; color:#000; }

  #intro { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); background:#000; text-align:center; overflow-y:auto; }
  #intro h1 { font-size:22px; letter-spacing:.08em; margin:0; font-weight:600; }
  #intro p { margin:0; max-width:34em; color:var(--dim); font-size:13.5px; line-height:1.65; }
  #intro .room-box { display:flex; gap:8px; align-items:center; margin-top:4px; }
  #intro input { background:#15181e; border:1px solid var(--line); color:#fff; padding:10px 14px; border-radius:999px; font-size:14px; width:160px; text-align:center; }
  #intro .go { font-size:16px; padding:14px 32px; background:#fff; color:#000; border:0; margin-top:4px; }
  #err { color:#ff8a7a; font-size:13px; min-height:1.4em; max-width:34em; line-height:1.6; }

  #panel { max-height:60vh; overflow:auto; position:fixed; left:12px; right:12px; bottom:calc(70px + env(safe-area-inset-bottom, 0px)); z-index:6;
    background:rgba(0,0,0,.78); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:none;
    max-width:460px; margin:0 auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #panel.open { display:block; }
  #panel label { display:grid; grid-template-columns: 7.5em 1fr 3em; align-items:center; gap:10px; font-size:13px; padding:6px 0; color:var(--dim); }
  #panel output { text-align:right; color:var(--fg); font-variant-numeric: tabular-nums; }
  #panel input[type=range] { width:100%; touch-action: pan-x; }
  #panel .row { display:flex; gap:8px; padding-top:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="intro">
  <h1>空間偏好 ／ 視野 AR（連機定位版）</h1>
  <p>1. <b>後台偵測與 Canny 標記物</b>：空間測量線已移至後台運算；系統結合 Canny 邊緣檢測與平面幾何，在物體邊緣生成標記物（A-1, A-2...），靠近至 2.2m 內即可激活並同步至伺服器地圖。</p>
  <p>2. <b>動態速度視野與記憶點雲</b>：不動時中央視野最大、慢走放大、快走縮小；外圍點雲密度取決於轉動時中央視野掃過該方位的次數。</p>
  <p>3. <b>敵人偵測與遮擋剔除</b>：捕捉前方拿著手機的連機玩家（敵人）並以白框標記；若被真實牆柱或虛擬生成的建築遮擋則自動隱藏。</p>
  <div class="room-box">
    <span style="font-size:13px;color:var(--dim);">房間頻道：</span>
    <input id="roomCode" type="text" value="AR-ROOM-1" placeholder="輸入相同房號連機">
  </div>
  <button id="start" class="btn go">開始連機進入</button>
  <a href="dashboard.html" target="_blank" style="color:#6effe1;font-size:12px;text-decoration:none;margin-top:4px;">開啟伺服器即時地圖監控端 (Dashboard) ↗</a>
  <div id="err"></div>
</div>

<div id="panel">
  <label>中央區基準 <input id="sSize" type="range" min="0.7" max="2" step="0.05"><output id="oSize"></output></label>
  <label>相機視角 <input id="sFov" type="range" min="45" max="90" step="1"><output id="oFov"></output></label>
  <label>步長（公尺）<input id="sStep" type="range" min="0.4" max="1" step="0.05"><output id="oStep"></output></label>
  <label>點雲敏感度 <input id="sDot" type="range" min="4" max="40" step="1"><output id="oDot"></output></label>
  <div class="row">
    <button id="bHud" class="btn">資訊文字</button>
    <button id="bClear" class="btn">清除虛擬建築</button>
    <button id="bGen" class="btn">立即生成一處</button>
    <button id="bScan" class="btn">重置掃描記憶</button>
    <button id="bSus" class="btn">觸發懸疑</button>
    <button id="bFree" class="btn">自由生成（不依附）</button>
  </div>
</div>

<div id="bar" hidden>
  <button id="bCal" class="btn">校準前方</button>
  <button id="bLimit" class="btn on">視野限制</button>
  <button id="bWalk" class="btn">按住前進</button>
  <button id="bSet" class="btn">設定</button>
</div>

<script src="app.js"></script>
</body>
</html>
